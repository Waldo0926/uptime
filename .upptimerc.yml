# Upptime config for github.com/Waldo0926/uptime (made from the upptime/upptime template).
# Checks every 5 minutes from GitHub Actions; a site that fails opens an issue and closes it when it is back.
owner: Waldo0926
repo: uptime

sites:
  - name: Monash Hub
    url: https://monashhub.secureview.tech
  - name: Monash Hub API
    url: https://monashhub.secureview.tech/api/health
  - name: SecureView
    url: https://secureview.tech
  - name: 马莫百科 bot
    url: https://wxbot.secureview.tech/health
  - name: Tool docs
    url: https://docs.secureview.tech
  - name: Blog
    url: https://blog.secureview.tech

assignees:
  - Waldo0926

status-website:
  # Served by GitHub Pages at https://waldo0926.github.io/uptime/.
  # For status.secureview.tech instead: add a CNAME record status -> waldo0926.github.io in Cloudflare
  # (DNS only, grey cloud), then replace baseUrl with: cname: status.secureview.tech
  baseUrl: /uptime
  name: Waldo's projects
  introTitle: "Status of the sites I run"
  introMessage: "Checked every 5 minutes from GitHub Actions. Each outage opens an issue in this repository."
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
